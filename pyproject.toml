[project]
name = "fishing-agent"
version = "3.0.2.1"
description = "智能钓鱼助手 v3.0.2.1 - 基于 LangChain 1.0+ 的钓鱼时间推荐和天气分析系统（7因子科学评分体系 + 架构优化 + LLM优化）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langgraph-cli[inmem]>=0.4.7",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.3.0",
    "requests>=2.25.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "langchain-openai>=1.0.1",
    "python-dotenv>=1.1.1",
    "pandas>=2.3.3",
    "pytz>=2025.2",
    "dashscope>=1.25.1",
    "aiohttp>=3.13.2",
    "sqlalchemy>=2.0.44",
    "pytest>=9.0.1",
    "fastapi>=0.121.2",
    "uvicorn>=0.38.0",
    "streamlit>=1.51.0",
    "redis>=7.0.1",
    "python-multipart>=0.0.20",
    "jinja2>=3.1.6",
    "alembic>=1.17.1",
    "langchain-core>=0.0.1",
    "langgraph-api>=0.5.14",
    "python-dateutil>=2.8.2",
    "langchain-mcp-adapters>=0.1.14",
    "langchain-oceanbase>=0.2.6",
    "chromadb>=0.4.22",
    "click>=8.1.0",
]

[project.optional-dependencies]
# 本地模型支持（未来扩展）
vector-local = [
    "sentence-transformers>=2.3.1",
    "transformers>=4.36.0",
    "torch>=2.1.0",
    "Pillow>=10.0.0",
]
