[project]
name = "data-processing"
version = "1.0.0"
description = "数据处理工具包"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0.0",
    "numpy>=2.2.0",
]

[project.optional-dependencies]
ocr = ["paddleocr<3", "paddlepaddle>=3.2.0", "opencv-python>=4.12.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
