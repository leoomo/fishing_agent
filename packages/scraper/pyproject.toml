[project]
name = "scraper"
version = "1.0.0"
description = "通用数据爬取框架"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.25.0",
    "beautifulsoup4>=4.12.0",
    "sqlalchemy>=2.0.0",
    "aiohttp>=3.8.0",
]

[project.optional-dependencies]
rpa = ["playwright>=1.40.0"]
scheduler = ["apscheduler>=3.10.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
